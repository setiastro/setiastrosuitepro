name: Command discovery QA

on:
  pull_request:
    paths:
      - 'src/setiastro/saspro/gui/**'
      - 'tests/test_command*.py'
      - 'tests/test_native_menus.py'
      - '.github/workflows/command-discovery.yml'
  push:
    branches: ['feat/command-search']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    name: Qt command discovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qpa: windows
          - os: ubuntu-latest
            qpa: offscreen
          - os: macos-latest
            qpa: offscreen
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install focused Qt test dependencies
        run: python -m pip install pytest PyQt6==6.11.0 PyQt6-Qt6==6.11.2 PyQt6-sip==13.12.0
      - name: Test command matching, popup and menu shortcut dispatch
        run: python -m pytest -q tests/test_command_search.py tests/test_command_palette.py tests/test_native_menus.py
